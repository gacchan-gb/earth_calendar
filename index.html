<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>地球カレンダー — 46億年を1年に</title>
<meta name="description" content="46億年を、1年に。地球の歴史を1年のカレンダーに縮めると、人類の歴史は大晦日の最後の数十分に収まる。">
<meta property="og:type" content="website">
<meta property="og:title" content="地球カレンダー — 46億年を1年に">
<meta property="og:description" content="46億年を、1年に。人類の歴史は、大晦日の最後の数十分の物語だ。">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0F1E;
    --bg-panel: #101832;
    --ink: #EDEAE3;
    --ink-dim: #8D93AC;
    --ink-faint: #545C77;
    --amber: #E8A33D;
    --amber-soft: rgba(232,163,61,0.16);
    --teal: #49B3A6;
    --violet: #A796F2;
    --line: rgba(237,234,227,0.12);
    --line-strong: rgba(237,234,227,0.22);
  }

  *{ box-sizing: border-box; }

  html{
    scroll-behavior: smooth;
    background: var(--bg);
    color-scheme: dark;
  }

  body{
    margin:0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(232,163,61,0.08), transparent),
      radial-gradient(ellipse 60% 40% at 90% 20%, rgba(73,179,166,0.06), transparent),
      var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .page{
    max-width: 760px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 5rem;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    justify-content:flex-end;
    margin-bottom: 2.25rem;
  }

  .lang-toggle{
    background: none;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    color: var(--ink-dim);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    padding: 0.38rem 0.95rem;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .lang-toggle:hover{ color: var(--ink); border-color: var(--ink-dim); }
  .lang-toggle:focus-visible{ outline: 2px solid var(--amber); outline-offset: 2px; }

  /* ---------- Hero ---------- */
  .hero{ text-align: center; margin-bottom: 2.5rem; }

  h1{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: clamp(2rem, 6vw, 3rem);
    margin: 0 0 1rem;
    line-height: 1.25;
  }

  .lede{
    color: var(--ink-dim);
    font-size: 1.05rem;
    line-height: 1.75;
    max-width: 30em;
    margin: 0 auto;
    white-space: pre-line;
    text-wrap: balance;
  }

  /* ---------- View tabs ---------- */
  .view-tabs{
    display:flex;
    flex-wrap: wrap;
    justify-content:center;
    width: max-content;
    max-width: 100%;
    margin: 0 auto;
    padding: 3px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
  }

  .view-tab{
    background: none;
    border: none;
    border-radius: 999px;
    color: var(--ink-dim);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    padding: 0.45rem 1.05rem;
    cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .view-tab:hover{ color: var(--ink); }
  .view-tab[aria-pressed="true"]{ background: var(--amber-soft); color: var(--amber); }
  .view-tab:focus-visible{ outline: 2px solid var(--amber); outline-offset: 1px; }

  .scale-note{
    text-align:center;
    color: var(--ink-faint);
    font-size: 0.8rem;
    line-height: 1.6;
    margin: 0.75rem 0 0;
  }

  .legend{
    display:flex;
    justify-content:center;
    flex-wrap: wrap;
    gap: 0.4rem 1.2rem;
    margin: 0.45rem 0 0;
    color: var(--ink-faint);
    font-size: 0.78rem;
  }
  .legend-item{ display:inline-flex; align-items:center; gap: 0.4rem; }
  .legend-dot{ width: 8px; height: 8px; border-radius: 50%; display:inline-block; }
  .legend-dot.before{ background: var(--teal); }
  .legend-dot.human{ background: var(--violet); }

  /* ---------- Wheel ---------- */
  .wheel-section{
    display: flex;
    justify-content: center;
    margin: 1.25rem 0 1rem;
  }

  .wheel-wrap{
    position: relative;
    width: min(420px, 88vw);
  }

  #wheel{ width: 100%; height: auto; display:block; }
  #wheel .layer{ transition: opacity 0.25s ease; }

  .wheel-readout{
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 62%;
    pointer-events: none;
  }

  .readout-caption{
    display:block;
    font-size: 0.78rem;
    color: var(--ink-dim);
    margin-bottom: 0.35rem;
    line-height: 1.5;
  }

  .readout-date{
    display:block;
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(1.5rem, 6vw, 2.05rem);
    font-variant-numeric: tabular-nums;
  }

  .readout-time{
    display:block;
    font-size: 0.95rem;
    color: var(--amber);
    font-variant-numeric: tabular-nums;
    margin-top: 0.15rem;
  }

  .wheel-note{
    text-align:center;
    color: var(--ink-faint);
    font-size: 0.85rem;
    line-height: 1.7;
    max-width: 31em;
    margin: 1.75rem auto 0;
  }

  /* ---------- Event markers ---------- */
  #wheel g.event-marker{ cursor: pointer; }
  #wheel g.event-marker circle.marker-dot{ transition: filter 0.12s ease; }
  #wheel g.event-marker:hover circle.marker-dot,
  #wheel g.event-marker:focus circle.marker-dot{ filter: brightness(1.3); }
  #wheel g.event-marker:focus{ outline: none; }
  #wheel g.event-marker:focus circle.marker-dot{ stroke: var(--ink); stroke-width: 1.5; }
  #wheel .position-marker{ pointer-events: none; }

  /* ---------- Detail panel ---------- */
  .detail-panel{
    position: relative;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0.4rem 1.3rem;
    margin: 2rem 0 0;
    max-height: 300px;
    overflow-y: auto;
  }

  .panel-placeholder{
    margin: 0;
    padding: 1.1rem 0;
    color: var(--ink-faint);
    font-size: 0.9rem;
    line-height: 1.6;
  }

  .panel-row{
    position: relative;
    padding: 0.7rem 0.15rem 0.7rem 1.1rem;
    border-top: 1px solid var(--line);
    cursor: pointer;
    border-radius: 6px;
  }
  .panel-row:first-child{ border-top: none; }
  .panel-row:hover,
  .panel-row:focus{
    background: var(--amber-soft);
    outline: none;
  }
  .panel-row.active{ background: var(--amber-soft); }
  .panel-row.active::before{
    content: '';
    position: absolute;
    left: 0.35rem;
    top: 0.45rem;
    bottom: 0.45rem;
    width: 2px;
    border-radius: 2px;
    background: var(--amber);
  }

  .panel-heading{
    margin: 0;
    padding: 0.85rem 0.15rem 0.55rem 1.1rem;
    color: var(--amber);
    font-size: 0.85rem;
    line-height: 1.6;
  }
  .panel-heading + .panel-row{ border-top: none; }

  .panel-tag{
    display:inline-block;
    margin-left: 0.5rem;
    color: var(--ink-dim);
  }

  .panel-year{
    display:block;
    font-size: 0.76rem;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    margin-bottom: 0.15rem;
  }

  .panel-label{
    display:block;
    font-size: 0.92rem;
    line-height: 1.55;
  }

  /* ---------- Playback controls ---------- */
  .playback-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap: wrap;
    gap:0.75rem;
    margin: 1.5rem auto 0;
  }

  #playBtn{
    background: var(--amber);
    color:#1A1305;
    border:none;
    border-radius: 8px;
    font-family:'Work Sans', sans-serif;
    font-size:0.95rem;
    font-weight:600;
    padding:0.6rem 1.2rem;
    cursor:pointer;
    min-width: 8.5em;
    transition: filter 0.15s ease;
  }
  #playBtn:hover{ filter: brightness(1.08); }
  #playBtn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  .ghost-btn{
    background: none;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.92rem;
    font-weight: 500;
    padding: 0.56rem 1rem;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .ghost-btn:hover{ border-color: var(--ink-dim); background: rgba(255,255,255,0.03); }
  .ghost-btn:focus-visible{ outline: 2px solid var(--amber); outline-offset: 2px; }

  .speed-group{ display:flex; align-items:center; gap: 0.45rem; }

  .speed-label{
    color: var(--ink-dim);
    font-size:0.85rem;
  }

  #speedSelect{
    background: rgba(255,255,255,0.03);
    border:1px solid var(--line-strong);
    border-radius:8px;
    color: var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:0.9rem;
    padding:0.45rem 0.6rem;
    cursor:pointer;
  }
  #speedSelect:focus-visible{ outline:2px solid var(--amber); outline-offset:1px; }

  .copy-status{
    text-align: center;
    color: var(--teal);
    font-size: 0.82rem;
    line-height: 1.6;
    min-height: 1.3em;
    margin: 0.7rem 0 0;
  }

  .copy-url{
    display:block;
    width: 100%;
    margin-top: 0.45rem;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.82rem;
    padding: 0.5rem 0.7rem;
  }

  /* ---------- Input ---------- */
  .input-section{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.75rem 1.75rem 1.5rem;
    margin: 2.25rem 0 2.75rem;
  }

  .input-section label{
    display:block;
    font-size: 0.95rem;
    color: var(--ink-dim);
    margin-bottom: 0.9rem;
  }

  .input-row{
    display:flex;
    align-items:center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  #yearsInput{
    flex: 1 1 200px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    font-size: 1.1rem;
    font-variant-numeric: tabular-nums;
    padding: 0.65rem 0.85rem;
    min-width: 0;
  }
  #yearsInput:focus-visible{ outline: 2px solid var(--amber); outline-offset: 1px; }

  .unit{ color: var(--ink-dim); font-size: 0.95rem; }

  #convertBtn{
    background: var(--amber);
    color: #1A1305;
    border: none;
    border-radius: 8px;
    font-family: 'Work Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    padding: 0.68rem 1.3rem;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  #convertBtn:hover{ filter: brightness(1.08); }
  #convertBtn:focus-visible{ outline: 2px solid var(--ink); outline-offset: 2px; }

  #yearsSlider{
    width: 100%;
    margin-top: 1.35rem;
    accent-color: var(--amber);
  }

  .slider-labels{
    display:flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--ink-faint);
    margin-top: 0.4rem;
  }

  /* ---------- Events ---------- */
  .events-section h2{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.4rem;
    margin: 0 0 1.5rem;
  }

  .event-group{ margin-bottom: 2rem; }

  .event-group h3{
    font-size: 0.85rem;
    color: var(--ink-dim);
    font-weight: 500;
    margin: 0 0 0.75rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--line);
  }

  .event-list{ list-style:none; margin:0; padding:0; }

  .event-item{
    display:flex;
    align-items: baseline;
    gap: 1rem;
    width:100%;
    background: none;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    text-align: left;
    padding: 0.85rem 0.25rem;
    cursor: pointer;
  }
  .event-list li:last-child .event-item{ border-bottom: none; }
  .event-item:hover .event-label,
  .event-item:focus-visible .event-label{ color: var(--amber); }
  .event-item:focus-visible{ outline: 2px solid var(--amber); outline-offset: -2px; }

  .event-year{
    flex: 0 0 auto;
    width: 8.2em;
    color: var(--ink-faint);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
  }

  .event-label{
    flex: 1 1 auto;
    font-size: 0.95rem;
    line-height: 1.5;
    transition: color 0.15s ease;
  }

  /* ---------- Footer ---------- */
  footer{
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--line);
    color: var(--ink-faint);
    font-size: 0.8rem;
    line-height: 1.7;
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    *{ transition: none !important; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="topbar">
    <button class="lang-toggle" id="langBtn" type="button" lang="en">English</button>
  </div>

  <header class="hero">
    <h1 data-i18n="title">地球カレンダー</h1>
    <p class="lede" data-i18n="lede">46億年を、1年に。
人類の歴史は、大晦日の最後の数十分の物語だ。</p>
  </header>

  <div class="view-tabs" id="viewTabs" role="group" aria-label="円の表示範囲">
    <button class="view-tab" type="button" data-view="year" aria-pressed="true">1年</button>
    <button class="view-tab" type="button" data-view="dec31" aria-pressed="false">12月31日</button>
    <button class="view-tab" type="button" data-view="lastmin" aria-pressed="false">最後の1分</button>
  </div>
  <p class="scale-note" id="scaleNote">円の1周 = 46億年</p>
  <div class="legend">
    <span class="legend-item"><span class="legend-dot before"></span><span data-i18n="groupBefore">ヒトの登場前</span></span>
    <span class="legend-item"><span class="legend-dot human"></span><span data-i18n="groupHuman">ヒトの登場</span></span>
  </div>

  <section class="wheel-section">
    <div class="wheel-wrap">
      <svg id="wheel" viewBox="0 0 480 480" role="img" aria-label="1年に圧縮した地球の歴史カレンダー"></svg>
      <div class="wheel-readout">
        <span class="readout-caption" id="readoutCaption"></span>
        <span class="readout-date" id="readoutDate"></span>
        <span class="readout-time" id="readoutTime"></span>
      </div>
    </div>
  </section>

  <div class="detail-panel" id="detailPanel" role="status" aria-live="polite"></div>

  <p class="wheel-note" data-i18n="wheelNote"></p>

  <div class="playback-controls">
    <button id="playBtn" type="button" aria-pressed="false">▶ 再生</button>
    <button id="resetBtn" class="ghost-btn" type="button" data-i18n="reset">リセット</button>
    <button id="todayBtn" class="ghost-btn" type="button" data-i18n="todayDate">今日の日付</button>
    <div class="speed-group">
      <label class="speed-label" for="speedSelect" data-i18n="speed">速度</label>
      <select id="speedSelect">
        <option value="0.5">0.5倍</option>
        <option value="1" selected>1倍</option>
        <option value="2">2倍</option>
        <option value="4">4倍</option>
      </select>
    </div>
    <button id="copyBtn" class="ghost-btn" type="button" data-i18n="copyLink">リンクをコピー</button>
  </div>
  <div class="copy-status" id="copyStatus" aria-live="polite"></div>

  <section class="input-section">
    <label for="yearsInput" data-i18n="inputLabel">何年前を1年に変換する？</label>
    <div class="input-row">
      <input type="text" id="yearsInput" inputmode="numeric" placeholder="例: 10000" value="0" />
      <span class="unit" data-i18n="unit">年前</span>
      <button id="convertBtn" type="button" data-i18n="convert">変換する</button>
    </div>
    <input type="range" id="yearsSlider" min="0" max="1000" step="1" value="0" aria-label="年数（対数目盛り）">
    <div class="slider-labels"><span data-i18n="sliderToday">今日</span><span data-i18n="sliderMax">46億年前</span></div>
  </section>

  <section class="events-section">
    <h2 data-i18n="eventsHeading">主な出来事から選ぶ</h2>
    <div class="event-group">
      <h3 data-i18n="groupBefore">ヒトの登場前</h3>
      <ul class="event-list" id="beforeHumanList"></ul>
    </div>
    <div class="event-group">
      <h3 data-i18n="groupHuman">ヒトの登場</h3>
      <ul class="event-list" id="humanList"></ul>
    </div>
  </section>

  <footer data-i18n="footer">主な出来事の年代は『サピエンス全史』と『ビッグヒストリー』等を参考。</footer>

</div>

<script>
(function(){

    { id:'z19', yearsAgo: 0,       ja:'今日', en:'Today' },
  ];

  const ALL_EVENTS = [...EVENTS_BEFORE, ...EVENTS_HUMAN];
  const EVENT_BY_ID = new Map(ALL_EVENTS.map(e => [e.id, e]));
  const PLACEABLE = ALL_EVENTS.filter(e => !e.exclude);

  // ================= 翻訳 =================
  const MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function trim2(x){ return x.toFixed(2).replace(/\.?0+$/, ''); }
  function pad(n){ return String(n).padStart(2,'0'); }

  const T = {
    ja: {
      docTitle: '地球カレンダー — 46億年を1年に',

      excludedCaption: '換算できません',

      },

    },
    en: {

      langToggle: '日本語',
      langToggleAria: '日本語に切り替え',
      viewTabsAria: 'Calendar zoom',
      tabs: { year:'Full year', dec31:'Dec 31', lastmin:'Final minute' },
      scale: {

        dec31: 'One lap = the 24 hours of Dec 31 (about 12.6 million years)',
        lastmin: 'One lap = the final minute, from 23:59 on Dec 31 (about 8,750 years)'
      },
      wheelAria: 'Earth’s history compressed into one calendar year',
      panelPlaceholder: 'Hover over a dot on the circle to see what happened there.',
      wheelNote: 'Hover over a dot (or tap it on a phone) to update the calendar and the details below. Double-ringed dots mark crowded moments. Click one to zoom in.',
      excludedPanel: label => `${label} happened before Earth formed, so it has no place on this calendar.`,
      excludedCaption: 'Out of range',
      excludedTime: 'Before Earth formed',
      play: '▶ Play', pause: '⏸ Pause', replay: '↻ Play again',
      reset: 'Reset',
      todayDate: 'Today’s date',
      todayOnDay: date => `What falls on today (${date})`,
      todayBetween: date => `Today (${date}) falls between these two events.`,
      betweenPrev: 'Before today',
      betweenNext: 'After today',
      speed: 'Speed',
      speeds: ['0.5×','1×','2×','4×'],
      copyLink: 'Copy link',
      copied: 'Link to this view copied',
      copyManual: 'Copy this URL to share the current view.',
      inputLabel: 'How many years ago?',
      unit: 'years ago',
      convert: 'Convert',
      placeholder: 'e.g. 10000',
      sliderAria: 'Years ago (log scale)',
      sliderToday: 'Today',
      sliderMax: '4.6 billion years ago',
      eventsHeading: 'Pick an event',
      groupBefore: 'Before humans',
      groupHuman: 'The age of humans',
      footer: 'Event dates are based on Sapiens: A Brief History of Humankind, Big History, and other sources.',
      zoomHint: 'Click to zoom in',
      locale: 'en-US',
      yearsFull: y => y === 0 ? 'Today' : `${y.toLocaleString('en-US')} years ago`,
      yearsShort: y => {
        if(y === 0) return 'Today';
        if(y >= 1e9) return `${trim2(y/1e9)} billion years ago`;
        if(y >= 1e6) return `${trim2(y/1e6)} million years ago`;
        return `${y.toLocaleString('en-US')} years ago`;
      },
      date: (m, d) => `${MONTHS_EN[m-1]} ${d}`,
      dayOfYear: n => `Day ${n}`,
      month: m => MONTHS_EN[m-1],
      hour: h => `${h}:00`,
      sec: s => s === 0 ? '23:59' : `:${pad(s)}`,
      excludedDate: y => `${trim2(y/1e9)} billion years ago`
    }
  };

  // ================= 状態 =================
  const state = {
    lang: 'ja',
    view: 'year',
    years: 0,
    focusId: null,      // 選択中の出来事
    excludedId: null,   // 換算できない出来事を選んでいるとき
  };
  let display = { type:'years', years:0 };       // 円の中に今出している内容
  let panelState = { type:'placeholder' };        // パネルに今出している内容
  let playLabelKey = 'play';

  function t(key){ return T[state.lang][key]; }
  function labelOf(ev){ return ev[state.lang]; }

  // ================= 計算 =================
  function clampYears(y){ return Math.max(0, Math.min(EARTH_AGE, y)); }
  function aOf(y){ return (EARTH_AGE - clampYears(y)) * 365 / EARTH_AGE; } // 0〜365（日）

  function computeDate(y){
    const a = aOf(y);
    if(a >= 365) return { a:365, dayOfYear:365, month:12, day:31, hour:24, minute:0, second:0 };
    const dayOfYear = Math.min(365, Math.floor(a) + 1);
    let month = 12, prevEnd = 334;
    for(let i = 0; i < MONTH_END_DAY.length; i++){
      if(dayOfYear <= MONTH_END_DAY[i]){ month = i + 1; prevEnd = i > 0 ? MONTH_END_DAY[i-1] : 0; break; }
    }
    const secs = (a - Math.floor(a)) * 86400;
    return {
      a, dayOfYear, month, day: dayOfYear - prevEnd,
      hour: Math.floor(secs / 3600),
      minute: Math.floor((secs % 3600) / 60),
      second: Math.floor(secs % 60)
    };
  }

  // 表示範囲（単位はaと同じ「日」）
  const VIEWS = {
    year:    { start: 0,               end: 365 },
    dec31:   { start: 364,             end: 365 },
    lastmin: { start: 365 - 60/86400,  end: 365 }
  };
  const VIEW_ORDER = ['year', 'dec31', 'lastmin'];

  function inView(view, a){ return a >= VIEWS[view].start - 1e-9; }
  function angleIn(view, a){
    const v = VIEWS[view];
    return Math.min(360, Math.max(0, (a - v.start) / (v.end - v.start) * 360));
  }
  function finestView(a){
    if(inView('lastmin', a)) return 'lastmin';
    if(inView('dec31', a)) return 'dec31';
    return 'year';
  }

  // 対数スライダー
  const MAX_LOG = Math.log10(EARTH_AGE);
  function sliderToYears(s){ return s <= 0 ? 0 : Math.pow(10, (s/1000) * MAX_LOG); }
  function yearsToSlider(y){
    if(y <= 1) return 0;
    return Math.round(Math.min(1000, Math.max(0, (Math.log10(y)/MAX_LOG) * 1000)));
  }

  // ================= 出来事のまとまり（表示範囲ごと） =================
  const THRESH = 2.5; // この角度より近い出来事は1つの点にまとめる

  function buildGroups(view){
    const pts = PLACEABLE
      .map(ev => ({ ev, a: aOf(ev.yearsAgo) }))
      .filter(p => inView(view, p.a))
      .map(p => ({ ...p, angle: angleIn(view, p.a) }))
      .sort((p, q) => p.angle - q.angle || q.ev.yearsAgo - p.ev.yearsAgo);

    const groups = [];
    pts.forEach(p => {
      const g = groups[groups.length - 1];
      if(g && p.angle - g.last < THRESH){ g.items.push(p.ev); g.last = p.angle; }
      else groups.push({ items:[p.ev], first:p.angle, last:p.angle });
    });

    const next = VIEW_ORDER[VIEW_ORDER.indexOf(view) + 1];
    groups.forEach(g => {
      g.angle = (g.first + g.last) / 2;
      g.zoomTo = (next && g.items.length > 1 && g.items.some(ev => inView(next, aOf(ev.yearsAgo)))) ? next : null;
    });
    return groups;
  }

  const GROUPS = { year: buildGroups('year'), dec31: buildGroups('dec31'), lastmin: buildGroups('lastmin') };
  function groupContaining(view, ev){ return GROUPS[view].find(g => g.items.includes(ev)); }

  // ================= 要素 =================
  const svg = document.getElementById('wheel');
  const panel = document.getElementById('detailPanel');
  const readoutCaption = document.getElementById('readoutCaption');
  const readoutDate = document.getElementById('readoutDate');
  const readoutTime = document.getElementById('readoutTime');
  const yearsInput = document.getElementById('yearsInput');
  const yearsSlider = document.getElementById('yearsSlider');
  const playBtn = document.getElementById('playBtn');
  const resetBtn = document.getElementById('resetBtn');
  const speedSelect = document.getElementById('speedSelect');
  const copyBtn = document.getElementById('copyBtn');
  const copyStatus = document.getElementById('copyStatus');
  const langBtn = document.getElementById('langBtn');
  const viewTabs = document.getElementById('viewTabs');
  const scaleNote = document.getElementById('scaleNote');

  // ================= SVG =================
  const CX = 240, CY = 240, R = 168;
  const NS = 'http://www.w3.org/2000/svg';
  const circumference = 2 * Math.PI * R;

  function polar(angleDeg, radius){
    const rad = (angleDeg - 90) * Math.PI / 180;
    return { x: CX + radius * Math.cos(rad), y: CY + radius * Math.sin(rad) };
  }
  function el(tag, attrs){
    const e = document.createElementNS(NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  svg.appendChild(el('circle', { cx:CX, cy:CY, r:R, fill:'none', stroke:'var(--line-strong)', 'stroke-width':1.5 }));
  const progressRing = el('circle', {
    cx:CX, cy:CY, r:R, fill:'none', stroke:'var(--amber)', 'stroke-width':4,
    'stroke-linecap':'round', 'stroke-dasharray':`0 ${circumference}`,
    transform:`rotate(-90 ${CX} ${CY})`
  });
  svg.appendChild(progressRing);
  // 現在位置マーカー（出来事の点より下に描き、二重丸が隠れないようにする。クリックは透過）
  const markerLine = el('line', { class:'position-marker', x1:CX, y1:CY, x2:CX, y2:CY, stroke:'var(--amber)', 'stroke-width':2, opacity:0.55 });
  const markerGlow = el('circle', { class:'position-marker', cx:CX, cy:CY-R, r:12, fill:'var(--amber)', opacity:0.25 });
  const markerDot = el('circle', { class:'position-marker', cx:CX, cy:CY-R, r:6.5, fill:'var(--amber)' });
  svg.appendChild(markerLine);
  svg.appendChild(markerGlow);
  svg.appendChild(markerDot);

  const tickLayer = el('g', { class:'layer' });
  const markerLayer = el('g', { class:'layer' });
  svg.appendChild(tickLayer);
  svg.appendChild(markerLayer);

  // 拡大した直後、カーソルの真下に現れた点が勝手に反応しないようにする
  let hoverLock = null;
  svg.addEventListener('pointermove', e => {
    if(hoverLock && Math.hypot(e.clientX - hoverLock.x, e.clientY - hoverLock.y) > 12) hoverLock = null;
  });
  function hoverAllowed(){ return hoverLock === null; }

  function tick(angle, inner, outer, width){
    const p1 = polar(angle, inner), p2 = polar(angle, outer);
    tickLayer.appendChild(el('line', { x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, stroke:'var(--line-strong)', 'stroke-width':width }));
  }
  function tickLabel(angle, text){
    const p = polar(angle, R - 26);
    const n = el('text', { x:p.x, y:p.y, fill:'var(--ink-faint)', 'font-size':'11', 'font-family':'Work Sans, sans-serif', 'text-anchor':'middle', 'dominant-baseline':'middle' });
    n.textContent = text;
    tickLayer.appendChild(n);
  }

  function drawTicks(view){
    tickLayer.replaceChildren();
    const L = T[state.lang];
    if(view === 'year'){
      let prev = 0;
      MONTH_END_DAY.forEach((cum, i) => {
        tick(cum/365*360, R-5, R+5, 1.2);
        tickLabel((prev + cum) / 2 / 365 * 360, L.month(i + 1));
        prev = cum;
      });
    } else if(view === 'dec31'){
      for(let h = 0; h < 24; h++){
        const major = h % 3 === 0;
        tick(h/24*360, major ? R-5 : R-3, major ? R+5 : R+3, major ? 1.2 : 0.8);
        if(major) tickLabel(h/24*360, L.hour(h));
      }
    } else {
      for(let s = 0; s < 60; s++){
        const major = s % 10 === 0;
        tick(s/60*360, major ? R-5 : R-2.5, major ? R+5 : R+2.5, major ? 1.2 : 0.7);
        if(major) tickLabel(s/60*360, L.sec(s));
      }
    }
  }

  function drawMarkers(view){
    markerLayer.replaceChildren();
    const groups = GROUPS[view];
    const hasEndGroup = groups.some(g => g.last > 360 - THRESH);

    groups.forEach(g => {
      // 円の始点（0°）と終点（360°）は同じ位置になるため、始点側の点は外側にずらして描く
      const offset = hasEndGroup && g.first < THRESH;
      const r = offset ? R + 18 : R;
      const p = polar(g.angle, r);
      const multi = g.items.length > 1;
      const color = g.items.some(ev => ev.id[0] === 'z') ? 'var(--violet)' : 'var(--teal)';

      const aria = g.items.map(ev => `${t('yearsShort')(ev.yearsAgo)} ${labelOf(ev)}`).join('。')
        + (g.zoomTo ? `。${t('zoomHint')}` : '');
      const node = el('g', { class:'event-marker', tabindex:'0', role:'button', 'aria-label':aria });

      if(offset){
        const a1 = polar(g.angle, R + 4), a2 = polar(g.angle, R + 11);
        node.appendChild(el('line', { x1:a1.x, y1:a1.y, x2:a2.x, y2:a2.y, stroke:'var(--line-strong)', 'stroke-width':1.2 }));
      }
      node.appendChild(el('circle', { cx:p.x, cy:p.y, r:11, fill:'transparent' }));
      if(g.zoomTo){
        node.appendChild(el('circle', { cx:p.x, cy:p.y, r:10, fill:'none', stroke:color, 'stroke-width':1.3, opacity:0.75 }));
      }
      node.appendChild(el('circle', { cx:p.x, cy:p.y, r: multi ? 6 : 4, fill:color, class:'marker-dot' }));
      markerLayer.appendChild(node);

      const activate = (e) => {
        if(g.zoomTo){
          if(e) hoverLock = { x: e.clientX, y: e.clientY };
          setView(g.zoomTo);
          syncURL();
        }
        renderPanel(g.items, null);
      };
      node.addEventListener('mouseenter', () => { if(hoverAllowed()) renderPanel(g.items, null); });
      node.addEventListener('focus', () => renderPanel(g.items, null));
      node.addEventListener('click', e => { e.stopPropagation(); activate(e); });
      node.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(null); }
      });
    });
  }

  function fadeInLayers(){
    tickLayer.style.opacity = 0;
    markerLayer.style.opacity = 0;
    requestAnimationFrame(() => {
      tickLayer.style.opacity = 1;
      markerLayer.style.opacity = 1;
    });
  }

  function updateWheel(a){
    const visible = a !== null && inView(state.view, a);
    const angle = visible ? angleIn(state.view, a) : 0;
    const p = polar(angle, R);
    markerLine.setAttribute('x2', p.x); markerLine.setAttribute('y2', p.y);
    markerDot.setAttribute('cx', p.x);  markerDot.setAttribute('cy', p.y);
    markerGlow.setAttribute('cx', p.x); markerGlow.setAttribute('cy', p.y);
    markerLine.style.opacity = visible ? 0.55 : 0;
    markerDot.style.opacity = visible ? 1 : 0;
    markerGlow.style.opacity = visible ? 0.25 : 0;
    const arc = angle / 360 * circumference;
    progressRing.setAttribute('stroke-dasharray', visible ? `${arc} ${circumference - arc}` : `0 ${circumference}`);
  }

  // ================= 表示範囲の切り替え =================
  function setView(view, { force = false } = {}){
    if(!VIEWS[view]) return;
    const changed = view !== state.view;
    state.view = view;
    viewTabs.querySelectorAll('.view-tab').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
    scaleNote.textContent = t('scale')[view];
    if(changed || force){
      drawTicks(view);
      drawMarkers(view);
      if(changed) fadeInLayers();
    }
    updateWheel(display.type === 'years' ? aOf(display.years) : null);
  }

  // ================= 円の中の表示 =================
  function render(y){
    display = { type:'years', years:y };
    const d = computeDate(y);
    updateWheel(d.a);
    readoutCaption.textContent = `${t('yearsFull')(Math.round(y))} · ${t('dayOfYear')(d.dayOfYear)}`;
    readoutDate.textContent = t('date')(d.month, d.day);
    readoutTime.textContent = `${pad(d.hour)}:${pad(d.minute)}:${pad(d.second)}`;
  }

  function renderExcluded(y){
    display = { type:'excluded', years:y };
    updateWheel(null);
    readoutCaption.textContent = t('excludedCaption');
    readoutDate.textContent = t('excludedDate')(y);
    readoutTime.textContent = t('excludedTime');
  }

  function setYears(y, { view = 'none', fromSlider = false } = {}){
    y = Number.isInteger(y) ? clampYears(y) : Math.round(clampYears(y));
    state.years = y;
    state.excludedId = null;
    yearsInput.value = y.toLocaleString(t('locale'));
    if(!fromSlider) yearsSlider.value = yearsToSlider(y);
    const a = aOf(y);
    if(view === 'finest') setView(finestView(a));
    else if(view === 'fit' && !inView(state.view, a)) setView(finestView(a));
    render(y);
  }

  // ================= 説明パネル =================
  function makeHeading(text){
    const h = document.createElement('p');
    h.className = 'panel-heading';
    h.textContent = text;
    return h;
  }

  function makeRow(ev, tag){
    const row = document.createElement('div');
    row.className = 'panel-row';
    row.tabIndex = 0;
    const y = document.createElement('span');
    y.className = 'panel-year';
    y.textContent = t('yearsShort')(ev.yearsAgo);
    if(tag){
      const tg = document.createElement('span');
      tg.className = 'panel-tag';
      tg.textContent = tag;
      y.appendChild(tg);
    }
    const l = document.createElement('span');
    l.className = 'panel-label';
    l.textContent = labelOf(ev);
    row.append(y, l);
    row.addEventListener('mouseenter', () => { if(!playing) render(ev.yearsAgo); });
    row.addEventListener('focus', () => { if(!playing) render(ev.yearsAgo); });
    row.addEventListener('click', () => { if(!playing) render(ev.yearsAgo); });
    return row;
  }

  function renderPanel(items, focusEv, { syncReadout = true, heading = null } = {}){
    panelState = { type:'group', ids: items.map(e => e.id), focusId: focusEv ? focusEv.id : null, heading };
    const sorted = [...items].sort((a, b) => b.yearsAgo - a.yearsAgo);
    const multi = sorted.length > 1;
    panel.replaceChildren();
    if(heading) panel.appendChild(makeHeading(heading()));
    let activeRow = null;

    sorted.forEach(ev => {
      const isActive = multi && ev === focusEv;
      // この行にカーソルを合わせると、円の中の表示もその出来事に切り替わる
      const row = makeRow(ev);
      if(isActive) row.classList.add('active');

      if(isActive) activeRow = row;
      panel.appendChild(row);
    });

    if(syncReadout){
      const target = focusEv || sorted.find(ev => inView(state.view, aOf(ev.yearsAgo))) || sorted[0];
      render(target.yearsAgo);
    }

    if(activeRow){
      panel.scrollTop = Math.max(0, activeRow.offsetTop - panel.clientHeight/2 + activeRow.offsetHeight/2);
    } else {
      panel.scrollTop = 0;
    }
  }

  function renderPanelMessage(text){
    panel.replaceChildren();
    const p = document.createElement('p');
    p.className = 'panel-placeholder';
    p.textContent = text;
    panel.appendChild(p);
    panel.scrollTop = 0;
  }

  function renderPanelExcluded(ev){
    panelState = { type:'excluded', id: ev.id };
    renderPanelMessage(t('excludedPanel')(labelOf(ev)));
  }

  // 今日の日付に出来事がないとき：前後2つの出来事を並べる
  function renderPanelBetween(prev, next, dateInfo){
    panelState = { type:'between', prevId: prev.id, nextId: next.id, dateInfo };
    panel.replaceChildren();
    panel.appendChild(makeHeading(t('todayBetween')(t('date')(dateInfo.month, dateInfo.day))));
    panel.appendChild(makeRow(prev, t('betweenPrev')));
    panel.appendChild(makeRow(next, t('betweenNext')));
    panel.scrollTop = 0;
  }

  function renderPanelPlaceholder(){
    panelState = { type:'placeholder' };
    renderPanelMessage(t('panelPlaceholder'));
  }

  function rerenderPanel(){
    if(panelState.type === 'group'){
      renderPanel(panelState.ids.map(id => EVENT_BY_ID.get(id)), EVENT_BY_ID.get(panelState.focusId) || null, { syncReadout:false, heading: panelState.heading });
    } else if(panelState.type === 'between'){
      renderPanelBetween(EVENT_BY_ID.get(panelState.prevId), EVENT_BY_ID.get(panelState.nextId), panelState.dateInfo);
    } else if(panelState.type === 'excluded'){
      renderPanelExcluded(EVENT_BY_ID.get(panelState.id));
    } else {
      renderPanelPlaceholder();
    }
  }

  // ================= 出来事を選ぶ =================
  function selectEvent(ev, { view = null, commit = true } = {}){
    if(playing) stopPlayback();
    if(ev.exclude){
      state.focusId = ev.id;
      state.excludedId = ev.id;
      yearsInput.value = ev.yearsAgo.toLocaleString(t('locale'));
      yearsSlider.value = 1000;
      renderExcluded(ev.yearsAgo);
      renderPanelExcluded(ev);
    } else {
      const a = aOf(ev.yearsAgo);
      setView((view && VIEWS[view] && inView(view, a)) ? view : finestView(a));
      setYears(ev.yearsAgo);
      state.focusId = ev.id;
      const g = groupContaining(state.view, ev);
      if(g) renderPanel(g.items, ev);
    }
    if(commit) syncURL();
  }

  function buildLists(){
    [['beforeHumanList', EVENTS_BEFORE], ['humanList', EVENTS_HUMAN]].forEach(([id, events]) => {
      const container = document.getElementById(id);
      container.replaceChildren();
      events.forEach(ev => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.className = 'event-item';
        btn.type = 'button';
        const y = document.createElement('span');
        y.className = 'event-year';
        y.textContent = t('yearsShort')(ev.yearsAgo);
        const l = document.createElement('span');
        l.className = 'event-label';
        l.textContent = labelOf(ev);
        btn.append(y, l);
        btn.addEventListener('click', () => selectEvent(ev));
        li.appendChild(btn);
        container.appendChild(li);
      });
    });
  }

  // ================= 入力欄・スライダー =================
  function parseInput(){
    const raw = yearsInput.value.replace(/[,，\s]/g, '');
    if(raw === '') return null;
    const n = Number(raw);
    return Number.isFinite(n) && n >= 0 ? n : null;
  }

  function doConvert(){
    const n = parseInput();
    if(n === null) return;
    if(playing) stopPlayback();
    state.focusId = null;
    setYears(n, { view:'finest' });
    syncURL();
  }

  document.getElementById('convertBtn').addEventListener('click', doConvert);
  yearsInput.addEventListener('keydown', e => { if(e.key === 'Enter') doConvert(); });
  yearsInput.addEventListener('input', () => { if(playing) stopPlayback(); });

  yearsSlider.addEventListener('input', () => {
    if(playing) stopPlayback();
    state.focusId = null;
    setYears(sliderToYears(Number(yearsSlider.value)), { view:'fit', fromSlider:true });
  });
  yearsSlider.addEventListener('change', syncURL);

  viewTabs.querySelectorAll('.view-tab').forEach(b => {
    b.addEventListener('click', () => { setView(b.dataset.view); syncURL(); });
  });

  // ================= 再生 =================
  // 1倍速での所要時間。大晦日と最後の1分は自動で拡大し、ゆっくり進める
  const SEGMENTS = [
    { view:'year',    start: VIEWS.year.start,    end: VIEWS.dec31.start,   ms: 36000 },
    { view:'dec31',   start: VIEWS.dec31.start,   end: VIEWS.lastmin.start, ms: 16000 },
    { view:'lastmin', start: VIEWS.lastmin.start, end: 365,                 ms: 16000 },
  ];
  const ZOOM_PAUSE_MS = 900; // 拡大した直後に一呼吸おく時間
  const SORTED_EVENTS = PLACEABLE.map(ev => ({ ev, a: aOf(ev.yearsAgo) })).sort((p, q) => p.a - q.a);
  let playing = false;
  let rafId = null;
  let lastFrameTime = null;
  let currentA = 0;
  let holdMs = 0;
  let passIdx = 0;
  let shownEv = null;

  function segmentFor(a){
    return SEGMENTS.find(seg => a < seg.end) || SEGMENTS[SEGMENTS.length - 1];
  }
  function yearsFromA(a){ return Math.max(0, EARTH_AGE * (1 - a / 365)); }

  function setPlayLabel(key){
    playLabelKey = key;
    playBtn.textContent = t(key);
  }

  function stopPlayback(labelKey){
    playing = false;
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null;
    lastFrameTime = null;
    setPlayLabel(labelKey || 'play');
    playBtn.setAttribute('aria-pressed', 'false');
  }

  // 針が出来事を通過したら、その出来事のまとまりをパネルに出す
  function updatePanelDuringPlayback(){
    const a = currentA;
    let passed = null;
    while(passIdx < SORTED_EVENTS.length && SORTED_EVENTS[passIdx].a <= a + 1e-12){
      passed = SORTED_EVENTS[passIdx].ev;
      passIdx++;
    }
    if(passed && passed !== shownEv){
      shownEv = passed;
      const g = groupContaining(state.view, passed) || groupContaining('year', passed);
      if(g) renderPanel(g.items, passed, { syncReadout:false });
    }
  }

  function playbackStep(now){
    if(!playing) return;
    if(lastFrameTime === null) lastFrameTime = now;
    const rawDt = now - lastFrameTime;
    lastFrameTime = now;

    // 拡大直後の一呼吸（速度に関係なく実時間で待つ）
    if(holdMs > 0){
      holdMs -= rawDt;
      rafId = requestAnimationFrame(playbackStep);
      return;
    }
    let dt = rawDt * Number(speedSelect.value);

    // 区間ごとに速さを変えて進める（区間をまたぐ場合も正しく配分）
    while(dt > 0 && currentA < 365){
      const seg = segmentFor(currentA);
      const rate = (seg.end - seg.start) / seg.ms;
      const room = (seg.end - currentA) / rate;
      if(dt < room){ currentA += rate * dt; dt = 0; }
      else { currentA = seg.end; dt -= room; break; } // 区間の境目で止めて、次のフレームで拡大
    }
    if(currentA > 365) currentA = 365;

    const seg = segmentFor(currentA);
    if(currentA < 365 && seg.view !== state.view){
      setView(seg.view);
      holdMs = ZOOM_PAUSE_MS;
    }

    if(currentA >= 365){
      setYears(0);
      updatePanelDuringPlayback();
      stopPlayback('replay');
      syncURL();
      return;
    }
    setYears(Math.floor(yearsFromA(currentA)));
    updatePanelDuringPlayback();
    rafId = requestAnimationFrame(playbackStep);
  }

  playBtn.addEventListener('click', () => {
    if(playing){
      stopPlayback();
      syncURL();
      return;
    }
    const parsed = parseInput();
    const fresh = state.excludedId || parsed === null || parsed <= 0;
    currentA = fresh ? 0 : aOf(Math.min(EARTH_AGE, parsed));
    passIdx = fresh ? 0 : SORTED_EVENTS.findIndex(p => p.a > currentA);
    if(passIdx < 0) passIdx = SORTED_EVENTS.length;
    shownEv = null;
    holdMs = 0;
    state.focusId = null;
    state.excludedId = null;
    setView(segmentFor(currentA).view);
    playing = true;
    lastFrameTime = null;
    setPlayLabel('pause');
    playBtn.setAttribute('aria-pressed', 'true');
    rafId = requestAnimationFrame(playbackStep);
  });

  // ================= リセット =================
  // ================= 今日の日付 =================
  // 実際の今日の日付と時刻を、このカレンダー上の位置として表示する
  document.getElementById('todayBtn').addEventListener('click', () => {
    if(playing) stopPlayback();
    const now = new Date();
    let month = now.getMonth() + 1;
    let day = now.getDate();
    if(month === 2 && day === 29) day = 28; // うるう日は2月28日として扱う
    const dayOfYear = (month > 1 ? MONTH_END_DAY[month - 2] : 0) + day;
    const secs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    const a = Math.min(365, (dayOfYear - 1) + secs / 86400);
    const years = Math.floor(EARTH_AGE * (1 - a / 365));

    state.focusId = null;
    state.excludedId = null;
    setView('year');
    setYears(years);
    copyStatus.replaceChildren();

    const dateInfo = { month, day };
    const sameDay = PLACEABLE.filter(ev => computeDate(ev.yearsAgo).dayOfYear === dayOfYear);
    if(sameDay.length){
      renderPanel(sameDay, null, { syncReadout:false, heading: () => t('todayOnDay')(t('date')(month, day)) });
    } else {
      const byA = SORTED_EVENTS.map(p => p.ev);
      const prev = [...byA].reverse().find(ev => computeDate(ev.yearsAgo).dayOfYear < dayOfYear);
      const next = byA.find(ev => computeDate(ev.yearsAgo).dayOfYear > dayOfYear);
      if(prev && next) renderPanelBetween(prev, next, dateInfo);
    }
    syncURL();
  });

  resetBtn.addEventListener('click', () => {
    if(playing) stopPlayback();
    setPlayLabel('play');
    state.focusId = null;
    state.excludedId = null;
    setView('year');
    setYears(0);
    renderPanelPlaceholder();
    copyStatus.replaceChildren();
    syncURL();
  });

  // ================= 共有URL =================
  function buildQuery(){
    const p = new URLSearchParams();
    p.set('lang', state.lang);
    if(state.focusId) p.set('e', state.focusId);
    else if(state.years > 0) p.set('y', String(state.years));
    if(state.view !== 'year') p.set('view', state.view);
    return '?' + p.toString();
  }

  function syncURL(){
    if(playing) return;
    try{ history.replaceState(null, '', buildQuery()); }catch(e){ /* プレビュー環境などでは無視 */ }
  }

  function shareURL(){
    try{
      const u = new URL(location.href);
      u.search = buildQuery();
      u.hash = '';
      return u.href;
    }catch(e){
      return buildQuery();
    }
  }

  let copyTimer = null;
  function showCopied(){
    copyStatus.textContent = t('copied');
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => { copyStatus.replaceChildren(); }, 2500);
  }
  function showManualCopy(url){
    clearTimeout(copyTimer);
    copyStatus.replaceChildren();
    const msg = document.createElement('span');
    msg.textContent = t('copyManual');
    const input = document.createElement('input');
    input.className = 'copy-url';
    input.readOnly = true;
    input.value = url;
    copyStatus.append(msg, input);
    input.focus();
    input.select();
  }

  copyBtn.addEventListener('click', async () => {
    syncURL();
    const url = shareURL();
    try{
      await navigator.clipboard.writeText(url);
      showCopied();
    }catch(e){
      showManualCopy(url);
    }
  });

  // ================= 言語切り替え =================
  function applyLanguage(){
    const L = T[state.lang];
    document.documentElement.lang = state.lang;
    document.title = L.docTitle;
    document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = L[n.dataset.i18n]; });
    yearsInput.placeholder = L.placeholder;
    yearsSlider.setAttribute('aria-label', L.sliderAria);
    svg.setAttribute('aria-label', L.wheelAria);
    viewTabs.setAttribute('aria-label', L.viewTabsAria);
    viewTabs.querySelectorAll('.view-tab').forEach(b => { b.textContent = L.tabs[b.dataset.view]; });
    [...speedSelect.options].forEach((o, i) => { o.textContent = L.speeds[i]; });
    langBtn.textContent = L.langToggle;
    langBtn.setAttribute('aria-label', L.langToggleAria);
    langBtn.lang = state.lang === 'ja' ? 'en' : 'ja';
    setPlayLabel(playLabelKey);
    copyStatus.replaceChildren();

    buildLists();
    setView(state.view, { force:true });
    rerenderPanel();
    if(display.type === 'years') render(display.years);
    else renderExcluded(display.years);
    if(!state.excludedId) yearsInput.value = state.years.toLocaleString(L.locale);
  }

  langBtn.addEventListener('click', () => {
    state.lang = state.lang === 'ja' ? 'en' : 'ja';
    applyLanguage();
    syncURL();
  });

  // ================= 初期化 =================
  (function init(){
    let params;
    try{ params = new URLSearchParams(location.search); }catch(e){ params = new URLSearchParams(); }

    const lp = params.get('lang');
    const browserLang = (navigator.language || 'ja').toLowerCase();
    state.lang = (lp === 'ja' || lp === 'en') ? lp : (browserLang.startsWith('ja') ? 'ja' : 'en');

    applyLanguage();
    render(0);
    renderPanelPlaceholder();

    const e = params.get('e');
    const y = params.get('y');
    const v = params.get('view');

    if(e && EVENT_BY_ID.has(e)){
      selectEvent(EVENT_BY_ID.get(e), { view: v, commit:false });
    } else if(y !== null && y !== '' && Number.isFinite(Number(y)) && Number(y) >= 0){
      const years = Math.round(clampYears(Number(y)));
      const a = aOf(years);
      setView((VIEWS[v] && inView(v, a)) ? v : 'year');
      setYears(years);
    } else if(VIEWS[v]){
      setView(v);
    }
  })();

})();
</script>
</body>
</html>
